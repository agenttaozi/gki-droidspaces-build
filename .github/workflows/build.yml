name: Build W210DS (ZTE open-source source) - Virtualization

on:
  workflow_dispatch:
    inputs:
      SUKISU:
        description: "注入 SukiSU 保留 root (false=仅虚拟化内核, 不集成 root, vermagic 最干净)"
        required: true
        default: "false"
      KERNEL_TREE:
        description: "中兴开源内核树目录 (仓库内自带, 已推入 zte-kernel/)"
        required: false
        default: "zte-kernel"
      CONFIG_FILE:
        description: "增量配置文件名(config/ 下): w210ds_virt.config=全功能(诊断) | w210ds_v10parity.config=V10全等保底"
        required: false
        default: "w210ds_virt.config"
      LTO_MODE:
        description: "LTO 模式: thin(默认,省内存) | full(对齐原厂) | none(关闭)"
        required: false
        default: "thin"
      CLANG:
        description: "工具链: apt=Ubuntu clang-14.0.0 | android=原厂同款 Android clang r450784e(14.0.7)"
        required: false
        default: "apt"
      MODVERSIONS:
        description: "on=保持原厂 MODVERSIONS=y(符号CRC校验, ABI 与原厂完全一致) | off=关闭CRC(改结构体后必需)"
        required: false
        default: "off"
      SYSVIPC:
        description: "on=开 SYSVIPC+001.kABI补丁(IPC_NS 依赖) | off=保持原厂 not set(ABI 完全一致)"
        required: false
        default: "on"
      KSU_TAG:
        description: "SukiSU-Ultra 版本标签(需与设备管理器版本一致): 默认 v4.1.2"
        required: false
        default: "v4.1.2"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write   # 创建/更新 Release 与上传 asset 需要
      actions: read
    steps:
      - name: Checkout this repo (含中兴开源内核树 zte-kernel/)
        uses: actions/checkout@v4

      - name: Install build deps (ZTE 5.15 支持; 使用 apt 的 clang-14)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev wget python3 git ccache \
            gcc-aarch64-linux-gnu libelf-dev zip curl pkg-config clang-14 lld-14 patch
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "PATH=/usr/lib/llvm-14/bin:$PATH" >> "$GITHUB_ENV"

      - name: Add swap (LTO=FULL 链接阶段内存峰值高, 防止 OOM)
        continue-on-error: true
        run: |
          # 注意: runner 沙箱里 swapon 可能挂住, 每条都加 timeout 且整步允许失败
          SW=/swapfile-wb
          ( timeout 90 sudo fallocate -l 8G "$SW" ) 2>/dev/null || ( timeout 90 sudo dd if=/dev/zero of="$SW" bs=1M count=8192 ) 2>/dev/null || true
          ( timeout 30 sudo chmod 600 "$SW" ) 2>/dev/null || true
          ( timeout 30 sudo mkswap "$SW" ) 2>/dev/null || true
          ( timeout 60 sudo swapon "$SW" ) 2>/dev/null || true
          ( free -h; echo '--- swap ---'; swapon --show ) || true

      - name: Compiler = clang-14 (apt) —— UTS_RELEASE 精确匹配原厂, 编译器小版本不影响模块 vermagic
        run: |
          set -e
          clang-14 --version | head -1
          ld.lld-14 --version | head -1
          echo "CLANG_CC=clang-14" >> "$GITHUB_ENV"
          echo "CLANG_LD=ld.lld-14" >> "$GITHUB_ENV"

      - name: Toolchain = Android clang r450784e (原厂同款 14.0.7)
        if: ${{ github.event.inputs.CLANG == 'android' }}
        run: |
          # 原厂内核 CC_VERSION_TEXT = "Android (8508608, based on r450784e) clang version 14.0.7"
          # apt 的 Ubuntu clang 是 14.0.0; nVHE hyp(EL2) 代码生成可能对编译器补丁级别敏感
          # googlesource 的 +archive 在本 runner 返回 400, 故改用 GitHub 上的 AOSP prebuilts 镜像
          DEST="$HOME/clang-r450784e"
          rm -rf "$DEST"; mkdir -p "$DEST"
          ok=0
          for U in \
            "https://codeload.github.com/snove520/clang-r450784e/tar.gz/refs/heads/main" \
            "https://codeload.github.com/chongqing-dev/prebuilts_clang_kernel_r450784e/tar.gz/refs/heads/lineage-22.2" \
            "https://codeload.github.com/LeafOS-experimental/android_prebuilts_clang_kernel_linux-x86_clang-r450784e/tar.gz/refs/heads/leaf-4.0" ; do
            echo "try $U"
            if curl -fL --retry 2 --retry-delay 5 -m 2400 "$U" -o /tmp/clang.tgz; then
              ls -la /tmp/clang.tgz
              # 不假设顶层目录结构(有的镜像带 <repo>-<branch>/ 前缀, 有的不带)
              rm -rf "$DEST"; mkdir -p "$DEST"
              if tar -xzf /tmp/clang.tgz -C "$DEST" 2>/dev/null; then ok=1; break; fi
              echo "  解包失败, 试下一个"
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::Android clang 下载失败, 回退到 apt clang-14 (构建继续, 但工具链与原厂不同)"
            exit 0
          fi
          # 定位 bin 目录（兼容 $DEST/bin 与 $DEST/<name>/bin 两种布局）
          BD=""
          for c in "$DEST/bin/clang" "$DEST"/*/bin/clang; do
            if [ -f "$c" ]; then BD=$(dirname "$c"); break; fi
          done
          if [ -z "$BD" ]; then
            echo "::warning::解包后找不到 clang, 回退 apt"; ls -la "$DEST" | head -20; exit 0
          fi
          echo "clang bin dir = $BD"
          chmod +x "$BD"/* 2>/dev/null || true
          LIBD=$(dirname "$BD")/lib64
          # AOSP clang 依赖 lib64/libLLVM-14git.so; 不在 rpath 里时必须显式给 LD_LIBRARY_PATH,
          # 否则 clang 一启动就挂 -> kconfig 报 "unknown compiler"。用包装脚本统一注入。
          mkdir -p "$HOME/tc/bin"
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf llvm-as llvm-link; do
            if [ -f "$BD/$t" ]; then
              printf '#!/bin/sh\nexport LD_LIBRARY_PATH="%s:%s/lib:$LD_LIBRARY_PATH"\nexec "%s/%s" "$@"\n' \
                "$LIBD" "$(dirname "$BD")" "$BD" "$t" > "$HOME/tc/bin/$t"
              chmod +x "$HOME/tc/bin/$t"
            fi
          done
          ls -la "$HOME/tc/bin" | head -15 || true
          "$HOME/tc/bin/clang" --version 2>&1 | head -2 || true
          echo "--- kbuild 编译器识别自检 (期望输出 Clang 14 0 7) ---"
          printf '#if defined(__clang__)\nClang __clang_major__ __clang_minor__ __clang_patchlevel__\n#endif\n' \
            | "$HOME/tc/bin/clang" -E -P -x c - 2>&1 | head -5 || true
          if ! printf '#if defined(__clang__)\nClang __clang_major__ __clang_minor__ __clang_patchlevel__\n#endif\n' \
              | "$HOME/tc/bin/clang" -E -P -x c - 2>/dev/null | grep -q '^Clang 14'; then
            echo "::warning::Android clang 自检失败, 回退到 apt clang-14"
            exit 0
          fi
          echo "PATH=$HOME/tc/bin:$BD:$PATH" >> "$GITHUB_ENV"
          echo "CLANG_CC=$HOME/tc/bin/clang" >> "$GITHUB_ENV"
          echo "CLANG_LD=$HOME/tc/bin/ld.lld" >> "$GITHUB_ENV"
          echo "CLANG_TAG=android-r450784e" >> "$GITHUB_ENV"

      - name: Prepare .config from 设备真实 w210ds_full.config + 开启虚拟化/跨平台 (基于中兴开源源码)
        run: |
          set -e
          KS="${{ github.event.inputs.KERNEL_TREE }}"
          cd "$KS"
          # Git-for-Windows 推送时丢失全部 +x 位, Linux runner 上内核构建直接执行的脚本
          # (scripts/config, cc-version.sh, pahole-flags.sh ...) 会报 Permission denied。一次性把整树加 +x。
          chmod -R a+x . 2>/dev/null || true
          # chmod 改了海量文件模式位, 让 git 忽略模式差异, 否则 setlocalversion 会判定脏树并追加 -dirty,
          # 使 UTS_RELEASE 偏离目标串、preflight 失败。
          git config core.filemode false 2>/dev/null || true
          # === KernelSU 内建集成 (kprobe 方式, 不需要手改内核源码) ===
          # 设备上的管理器是 SukiSU Ultra (com.sukisu.ultra v4.1.2), root 原本来自 init_boot ramdisk 里的
          # kernelsu.ko(声明 vermagic=5.15.194 + 需要 34 个我们树里没有的导出符号), 在自编译内核上装不进去。
          # 因此改为把 SukiSU 的内核侧源码直接编进内核 (CONFIG_KSU=y): root 内建, 且与已装的管理器协议一致。
          # 注意必须用 SukiSU-Ultra 而不是官方 KernelSU —— 两者 supercall 协议不同, 用官方的话 ksud 起不来、su 不存在。
          KSU_REPO=https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
          KSU_TAG="${{ github.event.inputs.KSU_TAG }}"
          if [ -z "$KSU_TAG" ]; then KSU_TAG="v4.1.2"; fi
          rm -rf ../KSU-src
          git clone --depth 1 --branch "$KSU_TAG" "$KSU_REPO" ../KSU-src 2>/dev/null || \
            git clone --depth 1 "$KSU_REPO" ../KSU-src
          if [ -d ../KSU-src/kernel/core ]; then
            rm -rf drivers/kernelsu
            cp -r ../KSU-src/kernel drivers/kernelsu
            # kernel/include/uapi 在仓库里是指向根 uapi/ 的符号链接; cp 后成悬空链接 -> 用真实目录替换
            rm -rf drivers/kernelsu/include/uapi
            cp -r ../KSU-src/uapi drivers/kernelsu/include/uapi
            grep -q 'kernelsu' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
              sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "SukiSU 源码已集成 ($(ls drivers/kernelsu | wc -l) 项); uapi 头 $(ls drivers/kernelsu/include/uapi | wc -l) 个"
          else
            echo "ERROR: SukiSU 拉取失败, 无法内建 root"; exit 1
          fi
          # 用【完整原厂 .config】作基底 (含全部 Unisoc 驱动选项, 确保模块_layout 与原厂内核一致)
          cp ../config/w210ds_full.config .config
          ./scripts/config --set-str UNUSED_KSYMS_WHITELIST ""
          ./scripts/config --disable TRIM_UNUSED_KSYMS
          # 开 SYSVIPC (IPC_NS 依赖; 原厂 config 里是 not set) —— 可用输入 SYSVIPC=off 保持原厂 ABI 完全一致
          SV="${{ github.event.inputs.SYSVIPC }}"
          if [ -z "$SV" ]; then SV="on"; fi
          if [ "$SV" = "on" ]; then
            ./scripts/config --enable SYSVIPC
            ./scripts/config --enable SYSVIPC_SYSCTL 2>/dev/null || true
            echo "SYSVIPC = on (配 001.kABI 补丁, 不改 task_struct 布局)"
          else
            ./scripts/config --disable SYSVIPC 2>/dev/null || true
            echo "SYSVIPC = off (与原厂一致, ABI 完全对齐)"
          fi
          ./scripts/config --disable DEBUG_INFO
          ./scripts/config --enable LD_IS_LLD
          # === LTO 模式(可切换): 原厂=FULL; 我们曾用 THIN 省内存, 但 B 版实测"纯原厂配置"也无 /dev/kvm,
          #     说明 KVM 失效来自构建链而非配置。LTO 是最可能改变 nVHE hyp 代码生成的项, 故参数化验证。===
          LTO="${{ github.event.inputs.LTO_MODE }}"
          if [ -z "$LTO" ]; then LTO="thin"; fi
          echo "LTO_MODE = $LTO"
          sed -i -E 's/^CONFIG_LTO_CLANG_FULL=.*/# CONFIG_LTO_CLANG_FULL is not set/; s/^CONFIG_LTO_CLANG_THIN=.*/# CONFIG_LTO_CLANG_THIN is not set/; s/^CONFIG_LTO_NONE=.*/# CONFIG_LTO_NONE is not set/' .config
          case "$LTO" in
            full) printf 'CONFIG_LTO_CLANG_FULL=y\n' >> .config ;;
            thin) printf 'CONFIG_LTO_CLANG_THIN=y\n' >> .config ;;
            none) printf 'CONFIG_LTO_NONE=y\n' >> .config ;;
            *) echo "ERROR: 未知 LTO_MODE=$LTO"; exit 1 ;;
          esac
          make LLVM=1 ARCH=arm64 CC="$CLANG_CC" LD="$CLANG_LD" olddefconfig
          echo "--- 实际 LTO 配置 ---"
          grep -E '^CONFIG_(LTO|LTO_CLANG|CFI)' .config || true
          case "$LTO" in
            full) grep -qE '^CONFIG_LTO_CLANG_FULL=y' .config || { echo "ERROR: LTO_CLANG_FULL 未生效"; exit 1; } ;;
            thin) grep -qE '^CONFIG_LTO_CLANG_THIN=y' .config || { echo "ERROR: LTO_CLANG_THIN 未生效"; exit 1; } ;;
            none) grep -qE '^CONFIG_LTO_NONE=y' .config || { echo "ERROR: LTO_NONE 未生效"; exit 1; } ;;
          esac
          # === 关键: UTS_RELEASE 精确匹配原厂 vendor_boot 里的 .ko 模块 ===
          # 模块 vermagic 唯一且均为:
          #   "5.15.178-android13-8-gb370d3baf5b7-ab20251103.222925 SMP preempt mod_unload modversions aarch64"
          # 中兴开源树 EXTRAVERSION 为空, 这里强制对齐模块那串 gb370d3baf5b7。
          sed -i -E 's/^VERSION[[:space:]]*=.*/VERSION = 5/' Makefile
          sed -i -E 's/^PATCHLEVEL[[:space:]]*=.*/PATCHLEVEL = 15/' Makefile
          sed -i -E 's/^SUBLEVEL[[:space:]]*=.*/SUBLEVEL = 178/' Makefile
          sed -i -E 's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION = -android13-8-gb370d3baf5b7-ab20251103.222925/' Makefile
          find . -maxdepth 1 -name 'localversion*' -not -name '*.c' -delete 2>/dev/null || true
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile
          ./scripts/config --disable LOCALVERSION_AUTO
          ./scripts/config --set-str LOCALVERSION ""
          # === SYSVIPC KABI 补丁: 开 IPC_NS 不改 task_struct 布局, 保护原厂 .ko ABI ===
          # 注意: 本步骤开头已 cd "$KS", 直接用 -p1 打当前目录; 再写 -d "$KS" 会变成 zte-kernel/zte-kernel(不存在)
          if [ "$SV" = "on" ]; then
            patch -p1 < ../patches/001.patch || echo "(001.patch 已含或跳过)"
            if grep -q 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' include/linux/sched.h; then
              echo "001.patch OK -> sysv_sem/sysv_shm 放进 KABI 保留位"
            else
              echo "WARN: 001.patch 未生效(task_struct 布局会变; MODVERSIONS=n 下仍可启动)"
            fi
          else
            echo "SYSVIPC=off -> 跳过 001.patch"
          fi
          # === KVM 命令行修复(必须成功): LK 会追加 kvm-arm.mode=none 把 KVM 关掉 ===
          # 实机 dmesg 证据: "kvm [1]: KVM disabled from command line"
          # 原厂内核因运行在 EL1 使内置 cmdline 的 protected 生效; 我们这版落在 VHE 分支 -> protected 被拒 -> none 残留
          patch -p1 < ../patches/002.kvm-ignore-cmdline-none.patch || echo "(002.patch 可能已应用)"
          if ! grep -q 'ignoring kvm-arm.mode=none' arch/arm64/kvm/arm.c; then
            echo "ERROR: 002.patch 未生效, 构建出的内核会被 kvm-arm.mode=none 关掉 KVM"; exit 1
          fi
          echo "002.patch OK -> kvm 将忽略 bootloader 的 kvm-arm.mode=none"
          # === 003: MODVERSIONS=n 时放宽 vermagic 比较 ===
          # 本机 ROM 的 kernelsu.ko 在 vendor_boot initramfs 里, 是为原厂内核(00012-g4ea0fcb5d130)编的;
          # 我们内核 vermagic 是 gb370d3baf5b7, MODVERSIONS=n 时上游做整串比较 -> 模块被拒 -> 没有 root
          patch -p1 < ../patches/003.module-relax-vermagic.patch || echo "(003.patch 可能已应用)"
          if ! grep -q 'wb: vermagic version ignored' kernel/module.c; then
            echo "ERROR: 003.patch 未生效"; exit 1
          fi
          echo "003.patch OK -> 放宽 vermagic 比较, 原厂 kernelsu.ko 可加载"
          # === 应用增量配置清单 (可用 workflow 输入 CONFIG_FILE 切换) ===
          CFG="${{ github.event.inputs.CONFIG_FILE }}"
          if [ -z "$CFG" ]; then CFG="w210ds_virt.config"; fi
          echo "--- 应用 $CFG ($(grep -cE '^CONFIG_[A-Z0-9_]+=y' ../config/$CFG) 项) ---"
          grep -E '^CONFIG_[A-Z0-9_]+=y' ../config/$CFG | sed -E 's/^CONFIG_//; s/=y$//' | while read -r s; do
            ./scripts/config --enable "$s" 2>/dev/null || true
          done
          # 挂死检测超时压到 60s(诊断需要快速触发 panic 拿栈; 无副作用)
          ./scripts/config --set-val DEFAULT_HUNG_TASK_TIMEOUT 60 2>/dev/null || true
          # 允许 adb shell 读 dmesg(原厂 user build 默认 restrict, 诊断期必须关; 定位后可恢复)
          ./scripts/config --disable SECURITY_DMESG_RESTRICT 2>/dev/null || true
          # 关闭 BTF: CI runner 无 pahole, 强制开会导致构建失败 (BTF 非必需)
          ./scripts/config --disable DEBUG_INFO_BTF 2>/dev/null || true
          # === 体积收紧: 把 Image 压回出厂槽位 ===
          # boot_a 尾部紧跟 AVB vbmeta+签名(我们在 CI 里没有中兴私钥, 无法重签, 也不能改动该布局),
          # 所以内核必须 <= 出厂 kernel_size 对齐槽位(47443968B)。以下均为"零/低功能损失"裁剪:
          #   KALLSYMS_ALL  仅影响 /proc/kallsyms 是否含全部符号(调试用) —— 无功能损失
          #   FUNCTION_TRACER 仅 ftrace 函数追踪框架(调试用) —— 无功能损失
          #   CIFS          SMB/CIFS 网络共享(与容器/虚拟化无关) —— 牺牲
          #   SQUASHFS      squashfs 只读镜像(容器多用 overlay/erofs) —— 牺牲
          ./scripts/config --disable KALLSYMS_ALL 2>/dev/null || true
          ./scripts/config --disable FUNCTION_TRACER 2>/dev/null || true
          ./scripts/config --disable CIFS 2>/dev/null || true
          ./scripts/config --disable SQUASHFS 2>/dev/null || true
          # === MODVERSIONS: on=保持原厂(符号CRC校验, ABI 与出厂内核逐符号一致) | off=关闭CRC并保留 vermagic 字样 ===
          MV="${{ github.event.inputs.MODVERSIONS }}"
          if [ -z "$MV" ]; then MV="off"; fi
          ./scripts/config --enable MODULE_UNLOAD
          if [ "$MV" = "on" ]; then
            ./scripts/config --enable MODVERSIONS
            echo "MODVERSIONS = on (原厂一致; 未改结构体的配置才能加载原厂 .ko)"
          else
            ./scripts/config --disable MODVERSIONS
            sed -i 's|#define MODULE_VERMAGIC_MODVERSIONS ""|#define MODULE_VERMAGIC_MODVERSIONS "modversions "|' include/linux/vermagic.h
            echo "--- vermagic.h 校验 ---"
            grep -n "MODULE_VERMAGIC_MODVERSIONS" include/linux/vermagic.h
            if grep -q 'MODULE_VERMAGIC_MODVERSIONS ""' include/linux/vermagic.h; then
              echo "ERROR: vermagic.h 改写失败"; exit 1
            fi
            echo "vermagic.h patched OK"
          fi
          # KernelSU 内建: Kconfig 已在步骤开头挂进 drivers/Kconfig, 这里打开 CONFIG_KSU=y
          ./scripts/config --enable KSU 2>/dev/null || echo "WARN: KSU 符号未找到"
          ./scripts/config --disable KSU_DEBUG 2>/dev/null || true
          sed -i 's/^# CONFIG_KSU is not set/CONFIG_KSU=y/' .config 2>/dev/null || true
          grep -q '^CONFIG_KSU=y' .config || sed -i 's/^CONFIG_KSU=m/CONFIG_KSU=y/' .config 2>/dev/null || true
          echo "KSU 配置: $(grep -E '^CONFIG_KSU' .config | tr '\n' ' ')"
          # 去掉 UTS_RELEASE 尾部 dirty 标记 "+" (双保险)
          git config --global --add safe.directory "$PWD" || true
          git config user.email buildbot@example.com || true
          git config user.name buildbot || true
          git add -A Makefile include/linux/vermagic.h >/dev/null 2>&1 || true
          git -c user.email=buildbot@example.com -c user.name=buildbot commit -q -m "ZTE source: virtualization config + vermagic align" >/dev/null 2>&1 || echo "(no changes to commit)"
          touch .scmversion
          make LLVM=1 ARCH=arm64 CC="$CLANG_CC" LD="$CLANG_LD" olddefconfig
          # === 秒级预检: UTS_RELEASE 必须逐个符号等于原厂真串 ===
          make LLVM=1 ARCH=arm64 CC="$CLANG_CC" LD="$CLANG_LD" include/config/kernel.release
          KR=$(cat include/config/kernel.release 2>/dev/null || true)
          if [ -z "$KR" ]; then
            KR=$(make -s LLVM=1 ARCH=arm64 CC="$CLANG_CC" LD="$CLANG_LD" kernelrelease 2>/dev/null | tail -1 || true)
          fi
          TARGET="5.15.178-android13-8-gb370d3baf5b7-ab20251103.222925"
          echo "UTS_RELEASE(preflight) = [$KR]"
          echo "TARGET                 = [$TARGET]"
          if [ "$KR" != "$TARGET" ]; then
            echo "ERROR: UTS_RELEASE 不等于目标串 (多余 '+' 或 '-g<sha>' 会让原厂 .ko 拒绝加载)"; exit 1
          fi
          echo "UTS_RELEASE preflight OK"
          if ! grep -q '^CONFIG_KSU=y' .config; then
            echo "ERROR: CONFIG_KSU 未生效(KernelSU 依赖 KPROBES+EXT4_FS, 检查 Kconfig 是否挂钩成功)"; exit 1
          fi
          echo "CONFIG_KSU=y OK -> root 内建"
          cd ..
          echo "=== 校验关键配置 ==="
          for k in PID_NS IPC_NS SYSVIPC USER_NS CGROUP_PIDS CFS_BANDWIDTH DEVTMPFS MACVLAN IP6_NF_NAT IKCONFIG KSU LOCALVERSION LOCALVERSION_AUTO LTO_CLANG_THIN MODVERSIONS MODULE_UNLOAD SMP PREEMPT KVM KVM_ARM64 VIRTIO VHOST OVERLAY_FS BRIDGE VETH SECCOMP BPF_SYSCALL; do
            v=$(grep -E "^CONFIG_${k}=" "$KS/.config" | head -1)
            echo "$k -> ${v:-NOT_SET}"
          done
          if [ "$MV" != "on" ] && grep -qE '^CONFIG_MODVERSIONS=y' "$KS/.config"; then
            echo "ERROR: CONFIG_MODVERSIONS 未关闭"; exit 1
          fi
          if [ "$MV" = "on" ] && ! grep -qE '^CONFIG_MODVERSIONS=y' "$KS/.config"; then
            echo "ERROR: 要求 MODVERSIONS=on 但未生效"; exit 1
          fi
          # === ABI 硬保护: 这两项会改变 task_struct / cfs_rq 布局, 原厂预编译 .ko 会踩错偏移直接崩(V10 时代的血泪) ===
          # 关 MODVERSIONS 只能绕过 CRC 校验, 绕不过结构体布局变化, 必须彻底不启用。
          for k in CGROUP_PIDS CFS_BANDWIDTH; do
            if grep -qE "^CONFIG_${k}=y" "$KS/.config"; then
              echo "ERROR: CONFIG_${k}=y 会破坏原厂 .ko ABI -> bootloop, 必须关闭"; exit 1
            fi
            echo "$k -> (correctly not set, ABI-safe)"
          done
          # === 符号冲突硬保护: PROC_KCORE/KEXEC 会 select CRASH_CORE -> 内核 EXPORT_SYMBOL(paddr_vmcoreinfo_note),
          #     与展锐 sysdump.ko 的同名导出冲突 -> "sysdump: exports duplicate symbol paddr_vmcoreinfo_note (owned by kernel)"
          #     -> sysdump.ko insmod 返回 Exec format error -> init 加载模块整体失败 -> Kernel panic(Attempted to kill init)
          #     实机日志已证实(run 40286626874 产物)：必须保持 CRASH_CORE / KEXEC_CORE = not set。
          for k in CRASH_CORE KEXEC_CORE; do
            if grep -qE "^CONFIG_${k}=y" "$KS/.config"; then
              echo "ERROR: CONFIG_${k}=y 会让内核导出 paddr_vmcoreinfo_note, 与展锐 sysdump.ko 冲突 -> 模块加载失败 -> panic"; exit 1
            fi
            echo "$k -> (correctly not set, sysdump.ko safe)"
          done
          # PROC_KCORE 是 CRASH_CORE 的唯一来源(本 config 未开 KEXEC), 单独再确认一次
          if grep -qE "^CONFIG_PROC_KCORE=y" "$KS/.config"; then
            echo "ERROR: CONFIG_PROC_KCORE=y -> select CRASH_CORE -> 符号冲突, 必须关闭"; exit 1
          fi
          echo "PROC_KCORE -> (correctly not set)"

      - name: Build uncompressed Image (clang-14, 中兴开源树)
        run: |
          set -e
          export PATH="/usr/lib/llvm-14/bin:$PATH"
          cd "${{ github.event.inputs.KERNEL_TREE }}"
          # CC_ARM32=clang: 用 clang 编 32 位 vdso32 (CONFIG_COMPAT=y), 避免 runner 缺 arm32 gcc
          # === 跳过 uapi 头文件自检测试(hdr-test) ===
          # 该测试与启动/内核功能无关, 仅校验"导出的 uapi 头文件能独立编译"。开启大量 NETFLTER_XT_* 后,
          # 部分头文件(如 xt_MARK.h)会 #include 未被导出的同伴头(xt_mark.h), 触发 hdr-test 失败并中断整个 make Image。
          # 清空 usr/include/Makefile 的 extra-y, 使其不再生成 .hdrtest 目标即可跳过(产物 Image 不受影响)。
          sed -i 's/^extra-y := .*/extra-y :=/' usr/include/Makefile
          grep -n '^extra-y' usr/include/Makefile || true
          make LLVM=1 ARCH=arm64 CC="$CLANG_CC" LD="$CLANG_LD" CC_ARM32=clang -j"$(nproc)" Image
          ls -la arch/arm64/boot/Image
          echo "=== Image 体积闸门 (出厂内核槽位 47443968 字节) ==="
          # boot_a 槽位之后紧跟 AVB vbmeta+签名(无中兴私钥无法重签), 故内核必须 <= 出厂槽位。
          SZ=$(stat -c%s arch/arm64/boot/Image)
          BUDGET=47443968
          echo "Image size = $SZ bytes"
          if [ "$SZ" -gt "$BUDGET" ]; then
            echo "ERROR: Image $SZ > 出厂槽位 $BUDGET, 必须精简配置后重试"; exit 1
          fi
          echo "Image 体积 OK (余量 $((BUDGET-SZ)) 字节)"
          echo "=== 校验产物 vermagic 精确匹配原厂模块 ==="
          VM=$(strings arch/arm64/boot/Image | grep -m1 "^5.15.178-android13-8-gb370d3baf5b7-ab20251103.222925 SMP preempt mod_unload modversions aarch64$" || true)
          if [ -z "$VM" ]; then
            echo "ERROR: vermagic 未精确匹配原厂模块, 产物不可用"
            strings arch/arm64/boot/Image | grep -m5 "^5\.15\.178" || true
            exit 1
          fi
          echo "vermagic OK -> $VM"
          cd ..

      - name: Reassemble boot_a.bin from parts
        run: |
          cat assets/boot_a.part* > assets/boot_a.bin
          ls -l assets/boot_a.bin
          echo "reassembled boot_a.bin from parts"

      - name: Locate boot_a.bin
        run: |
          BOOT=assets/boot_a.bin
          if [ ! -f "$BOOT" ]; then
            if [ -z "${{ secrets.BOOT_URL }}" ]; then
              echo "ERROR: 既无 assets/boot_a.bin 也无 BOOT_URL secret"; exit 1
            fi
            mkdir -p assets
            curl -L "${{ secrets.BOOT_URL }}" -o "$BOOT"
          fi
          echo "BOOT=$BOOT" >> "$GITHUB_ENV"
          echo "KERNEL=${{ github.event.inputs.KERNEL_TREE }}/arch/arm64/boot/Image" >> "$GITHUB_ENV"

      - name: Repack boot image (字节级内核替换)
        run: |
          set -e
          python3 scripts/repack.py "$BOOT" "$KERNEL" boot_a_w210ds_virt.img
          ls -la boot_a_w210ds_virt.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot_a_w210ds_virt.img
          path: boot_a_w210ds_virt.img

      - name: Publish boot img to GitHub Release (永久下载链接)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=w210ds-latest
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" push --delete origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" boot_a_w210ds_virt.img \
            --repo "$GITHUB_REPOSITORY" \
            --title "W210DS 虚拟化内核 (ZTE source, latest)" \
            --notes "基于中兴 W210DS 开源内核源码编译, 在 V10 基础上全开 KVM/Docker/虚拟化/跨平台玩机相关功能(命名空间/cgroup/overlayfs/KVM/VirtIO/VHOST/9P/网桥/veth/macvlan/netfilter-nftables/BPF/binfmt_misc 等)。EXTRAVERSION 对齐展讯模块树 gb370d3baf5b7, 关闭 MODVERSIONS 的 CRC 校验但保留 vermagic 中的 modversions 字样, 使 vendor_boot 里原厂 .ko 能正常加载。刷入前请确认设备处于 A/B 安全槽(boot_a)。"
          echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/boot_a_w210ds_virt.img" >> "$GITHUB_ENV"
          echo "成品下载地址: $RELEASE_URL"
