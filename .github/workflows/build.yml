name: Build W210DS (ZTE open-source source) - Virtualization

on:
  workflow_dispatch:
    inputs:
      SUKISU:
        description: "注入 SukiSU 保留 root (false=仅虚拟化内核, 不集成 root, vermagic 最干净)"
        required: true
        default: "false"
      KERNEL_TREE:
        description: "中兴开源内核树目录 (仓库内自带, 已推入 zte-kernel/)"
        required: false
        default: "zte-kernel"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repo (含中兴开源内核树 zte-kernel/)
        uses: actions/checkout@v4

      - name: Install build deps (ZTE 5.15 支持; 使用 apt 的 clang-14)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev wget python3 git ccache \
            gcc-aarch64-linux-gnu libelf-dev zip curl pkg-config clang-14 lld-14 patch
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "PATH=/usr/lib/llvm-14/bin:$PATH" >> "$GITHUB_ENV"

      - name: Compiler = clang-14 (apt) —— UTS_RELEASE 精确匹配原厂, 编译器小版本不影响模块 vermagic
        run: |
          set -e
          clang-14 --version | head -1
          ld.lld-14 --version | head -1
          echo "CLANG_CC=clang-14" >> "$GITHUB_ENV"
          echo "CLANG_LD=ld.lld-14" >> "$GITHUB_ENV"

      - name: Prepare .config from 设备真实 w210ds_full.config + 开启虚拟化/跨平台 (基于中兴开源源码)
        run: |
          set -e
          KS="${{ github.event.inputs.KERNEL_TREE }}"
          cd "$KS"
          # Git-for-Windows 推送时丢失全部 +x 位, Linux runner 上内核构建直接执行的脚本
          # (scripts/config, cc-version.sh, pahole-flags.sh ...) 会报 Permission denied。一次性把整树加 +x。
          chmod -R a+x . 2>/dev/null || true
          # chmod 改了海量文件模式位, 让 git 忽略模式差异, 否则 setlocalversion 会判定脏树并追加 -dirty,
          # 使 UTS_RELEASE 偏离目标串、preflight 失败。
          git config core.filemode false 2>/dev/null || true
          # 用【完整原厂 .config】作基底 (含全部 Unisoc 驱动选项, 确保模块_layout 与原厂内核一致)
          cp ../config/w210ds_full.config .config
          ./scripts/config --set-str UNUSED_KSYMS_WHITELIST ""
          ./scripts/config --disable TRIM_UNUSED_KSYMS
          # 开 SYSVIPC (IPC_NS 依赖; 原厂 config 里是 not set)
          ./scripts/config --enable SYSVIPC
          ./scripts/config --disable DEBUG_INFO
          ./scripts/config --enable LD_IS_LLD
          # 改用 LTO_CLANG_THIN (原厂 FULL 在 7GB runner 会 OOM; THIN 链接内存峰值低得多)
          sed -i -E 's/^CONFIG_LTO_CLANG_FULL=.*/# CONFIG_LTO_CLANG_FULL is not set/; s/^CONFIG_LTO_NONE=.*/# CONFIG_LTO_NONE is not set/' .config
          printf 'CONFIG_LTO_CLANG_THIN=y\n' >> .config
          make LLVM=1 ARCH=arm64 CC=clang-14 LD=ld.lld-14 olddefconfig
          if grep -qE '^CONFIG_LTO_CLANG_FULL=y' .config; then
            echo "ERROR: LTO_CLANG_FULL 仍存在(会 OOM)"; grep -E 'CONFIG_LTO' .config; exit 1
          fi
          if ! grep -qE '^CONFIG_LTO_CLANG_THIN=y' .config; then
            echo "ERROR: LTO_CLANG_THIN 未启用"; grep -E 'CONFIG_LTO' .config; exit 1
          fi
          # === 关键: UTS_RELEASE 精确匹配原厂 vendor_boot 里的 .ko 模块 ===
          # 模块 vermagic 唯一且均为:
          #   "5.15.178-android13-8-gb370d3baf5b7-ab20251103.222925 SMP preempt mod_unload modversions aarch64"
          # 中兴开源树 EXTRAVERSION 为空, 这里强制对齐模块那串 gb370d3baf5b7。
          sed -i -E 's/^VERSION[[:space:]]*=.*/VERSION = 5/' Makefile
          sed -i -E 's/^PATCHLEVEL[[:space:]]*=.*/PATCHLEVEL = 15/' Makefile
          sed -i -E 's/^SUBLEVEL[[:space:]]*=.*/SUBLEVEL = 178/' Makefile
          sed -i -E 's/^EXTRAVERSION[[:space:]]*=.*/EXTRAVERSION = -android13-8-gb370d3baf5b7-ab20251103.222925/' Makefile
          find . -maxdepth 1 -name 'localversion*' -not -name '*.c' -delete 2>/dev/null || true
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile
          ./scripts/config --disable LOCALVERSION_AUTO
          ./scripts/config --set-str LOCALVERSION ""
          # === SYSVIPC KABI 补丁: 开 IPC_NS 不改 task_struct 布局, 保护原厂 .ko ABI ===
          # 打进 zte-kernel/ 子目录 (--directory), 失败则 patch -p1 兜底, 再不行跳过
          git apply --directory="$KS" ../patches/001.patch 2>/dev/null || \
          patch -p1 -d "$KS" < ../patches/001.patch 2>/dev/null || \
            echo "(001.patch 已含或跳过)"
          # === 应用 V10 + 虚拟化/跨平台 全开清单 (w210ds_virt.config) ===
          echo "--- 应用 w210ds_virt.config ($(grep -cE '^CONFIG_[A-Z0-9_]+=y' ../config/w210ds_virt.config) 项) ---"
          grep -E '^CONFIG_[A-Z0-9_]+=y' ../config/w210ds_virt.config | sed -E 's/^CONFIG_//; s/=y$//' | while read -r s; do
            ./scripts/config --enable "$s" 2>/dev/null || true
          done
          # 关闭 BTF: CI runner 无 pahole, 强制开会导致构建失败 (BTF 非必需)
          ./scripts/config --disable DEBUG_INFO_BTF 2>/dev/null || true
          # === 体积收紧: 把 Image 压回出厂槽位 ===
          # boot_a 尾部紧跟 AVB vbmeta+签名(我们在 CI 里没有中兴私钥, 无法重签, 也不能改动该布局),
          # 所以内核必须 <= 出厂 kernel_size 对齐槽位(47443968B)。以下均为"零/低功能损失"裁剪:
          #   KALLSYMS_ALL  仅影响 /proc/kallsyms 是否含全部符号(调试用) —— 无功能损失
          #   FUNCTION_TRACER 仅 ftrace 函数追踪框架(调试用) —— 无功能损失
          #   CIFS          SMB/CIFS 网络共享(与容器/虚拟化无关) —— 牺牲
          #   SQUASHFS      squashfs 只读镜像(容器多用 overlay/erofs) —— 牺牲
          ./scripts/config --disable KALLSYMS_ALL 2>/dev/null || true
          ./scripts/config --disable FUNCTION_TRACER 2>/dev/null || true
          ./scripts/config --disable CIFS 2>/dev/null || true
          ./scripts/config --disable SQUASHFS 2>/dev/null || true
          # === 关键修复: 关闭 CRC 校验, 但强行保留 vermagic 里的 "modversions" 字样 ===
          # 新增命名空间等会改变 nsproxy/cred 布局, 原厂 .ko 的 module_layout CRC 对不上;
          # 关 MODVERSIONS 让内核不再做 CRC 校验, 同时保留 "modversions" 字符串使 vermagic 整串全等。
          ./scripts/config --disable MODVERSIONS
          ./scripts/config --enable MODULE_UNLOAD
          sed -i 's|#define MODULE_VERMAGIC_MODVERSIONS ""|#define MODULE_VERMAGIC_MODVERSIONS "modversions "|' include/linux/vermagic.h
          echo "--- vermagic.h 校验 ---"
          grep -n "MODULE_VERMAGIC_MODVERSIONS" include/linux/vermagic.h
          if grep -q 'MODULE_VERMAGIC_MODVERSIONS ""' include/linux/vermagic.h; then
            echo "ERROR: vermagic.h 改写失败"; exit 1
          fi
          echo "vermagic.h patched OK"
          if ./scripts/config --enable KSU 2>/dev/null; then echo "KSU enabled"; else echo "KSU symbol not present (ok)"; fi
          # 去掉 UTS_RELEASE 尾部 dirty 标记 "+" (双保险)
          git config --global --add safe.directory "$PWD" || true
          git config user.email buildbot@example.com || true
          git config user.name buildbot || true
          git add -A Makefile include/linux/vermagic.h >/dev/null 2>&1 || true
          git -c user.email=buildbot@example.com -c user.name=buildbot commit -q -m "ZTE source: virtualization config + vermagic align" >/dev/null 2>&1 || echo "(no changes to commit)"
          touch .scmversion
          make LLVM=1 ARCH=arm64 CC=clang-14 LD=ld.lld-14 olddefconfig
          # === 秒级预检: UTS_RELEASE 必须逐个符号等于原厂真串 ===
          make LLVM=1 ARCH=arm64 CC=clang-14 LD=ld.lld-14 include/config/kernel.release
          KR=$(cat include/config/kernel.release 2>/dev/null || true)
          if [ -z "$KR" ]; then
            KR=$(make -s LLVM=1 ARCH=arm64 CC=clang-14 LD=ld.lld-14 kernelrelease 2>/dev/null | tail -1 || true)
          fi
          TARGET="5.15.178-android13-8-gb370d3baf5b7-ab20251103.222925"
          echo "UTS_RELEASE(preflight) = [$KR]"
          echo "TARGET                 = [$TARGET]"
          if [ "$KR" != "$TARGET" ]; then
            echo "ERROR: UTS_RELEASE 不等于目标串 (多余 '+' 或 '-g<sha>' 会让原厂 .ko 拒绝加载)"; exit 1
          fi
          echo "UTS_RELEASE preflight OK"
          cd ..
          echo "=== 校验关键配置 ==="
          for k in PID_NS IPC_NS SYSVIPC USER_NS CGROUP_PIDS CFS_BANDWIDTH DEVTMPFS MACVLAN IP6_NF_NAT IKCONFIG KSU LOCALVERSION LOCALVERSION_AUTO LTO_CLANG_THIN MODVERSIONS MODULE_UNLOAD SMP PREEMPT KVM KVM_ARM64 VIRTIO VHOST OVERLAY_FS BRIDGE VETH SECCOMP BPF_SYSCALL; do
            v=$(grep -E "^CONFIG_${k}=" "$KS/.config" | head -1)
            echo "$k -> ${v:-NOT_SET}"
          done
          if grep -qE '^CONFIG_MODVERSIONS=y' "$KS/.config"; then
            echo "ERROR: CONFIG_MODVERSIONS 未关闭"; exit 1
          fi

      - name: Build uncompressed Image (clang-14, 中兴开源树)
        run: |
          set -e
          export PATH="/usr/lib/llvm-14/bin:$PATH"
          cd "${{ github.event.inputs.KERNEL_TREE }}"
          # CC_ARM32=clang: 用 clang 编 32 位 vdso32 (CONFIG_COMPAT=y), 避免 runner 缺 arm32 gcc
          # === 跳过 uapi 头文件自检测试(hdr-test) ===
          # 该测试与启动/内核功能无关, 仅校验"导出的 uapi 头文件能独立编译"。开启大量 NETFLTER_XT_* 后,
          # 部分头文件(如 xt_MARK.h)会 #include 未被导出的同伴头(xt_mark.h), 触发 hdr-test 失败并中断整个 make Image。
          # 清空 usr/include/Makefile 的 extra-y, 使其不再生成 .hdrtest 目标即可跳过(产物 Image 不受影响)。
          sed -i 's/^extra-y := .*/extra-y :=/' usr/include/Makefile
          grep -n '^extra-y' usr/include/Makefile || true
          make LLVM=1 ARCH=arm64 CC=clang-14 LD=ld.lld-14 CC_ARM32=clang -j"$(nproc)" Image
          ls -la arch/arm64/boot/Image
          echo "=== Image 体积闸门 (出厂内核槽位 47443968 字节) ==="
          # boot_a 槽位之后紧跟 AVB vbmeta+签名(无中兴私钥无法重签), 故内核必须 <= 出厂槽位。
          SZ=$(stat -c%s arch/arm64/boot/Image)
          BUDGET=47443968
          echo "Image size = $SZ bytes"
          if [ "$SZ" -gt "$BUDGET" ]; then
            echo "ERROR: Image $SZ > 出厂槽位 $BUDGET, 必须精简配置后重试"; exit 1
          fi
          echo "Image 体积 OK (余量 $((BUDGET-SZ)) 字节)"
          echo "=== 校验产物 vermagic 精确匹配原厂模块 ==="
          VM=$(strings arch/arm64/boot/Image | grep -m1 "^5.15.178-android13-8-gb370d3baf5b7-ab20251103.222925 SMP preempt mod_unload modversions aarch64$" || true)
          if [ -z "$VM" ]; then
            echo "ERROR: vermagic 未精确匹配原厂模块, 产物不可用"
            strings arch/arm64/boot/Image | grep -m5 "^5\.15\.178" || true
            exit 1
          fi
          echo "vermagic OK -> $VM"
          cd ..

      - name: Reassemble boot_a.bin from parts
        run: |
          cat assets/boot_a.part* > assets/boot_a.bin
          ls -l assets/boot_a.bin
          echo "reassembled boot_a.bin from parts"

      - name: Locate boot_a.bin
        run: |
          BOOT=assets/boot_a.bin
          if [ ! -f "$BOOT" ]; then
            if [ -z "${{ secrets.BOOT_URL }}" ]; then
              echo "ERROR: 既无 assets/boot_a.bin 也无 BOOT_URL secret"; exit 1
            fi
            mkdir -p assets
            curl -L "${{ secrets.BOOT_URL }}" -o "$BOOT"
          fi
          echo "BOOT=$BOOT" >> "$GITHUB_ENV"
          echo "KERNEL=${{ github.event.inputs.KERNEL_TREE }}/arch/arm64/boot/Image" >> "$GITHUB_ENV"

      - name: Repack boot image (字节级内核替换)
        run: |
          set -e
          python3 scripts/repack.py "$BOOT" "$KERNEL" boot_a_w210ds_virt.img
          ls -la boot_a_w210ds_virt.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot_a_w210ds_virt.img
          path: boot_a_w210ds_virt.img

      - name: Publish boot img to GitHub Release (永久下载链接)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=w210ds-latest
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" push --delete origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" boot_a_w210ds_virt.img \
            --repo "$GITHUB_REPOSITORY" \
            --title "W210DS 虚拟化内核 (ZTE source, latest)" \
            --notes "基于中兴 W210DS 开源内核源码编译, 在 V10 基础上全开 KVM/Docker/虚拟化/跨平台玩机相关功能(命名空间/cgroup/overlayfs/KVM/VirtIO/VHOST/9P/网桥/veth/macvlan/netfilter-nftables/BPF/binfmt_misc 等)。EXTRAVERSION 对齐展讯模块树 gb370d3baf5b7, 关闭 MODVERSIONS 的 CRC 校验但保留 vermagic 中的 modversions 字样, 使 vendor_boot 里原厂 .ko 能正常加载。刷入前请确认设备处于 A/B 安全槽(boot_a)。"
          echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/boot_a_w210ds_virt.img" >> "$GITHUB_ENV"
          echo "成品下载地址: $RELEASE_URL"
