name: Build W210DS GKI (Droidspaces)

on:
  workflow_dispatch:
    inputs:
      SUKISU:
        description: "注入 SukiSU 保留 root (false 则只编译命名空间内核，不集成 root)"
        required: true
        default: "true"
      KERNEL_COMMIT:
        description: "GKI 源码提交 (默认对应你设备的 5.15.178 android13-5.15-2025-03_r6)"
        required: false
        default: "4ea0fcb5d1308f2f5a5d"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build deps (GKI 5.15 支持；clang 用 NDK 自带的，不装 apt 的)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev wget python3 git ccache \
            gcc-aarch64-linux-gnu libelf-dev zip curl pkg-config
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Download clang 14.0.7 (r450784e) via Android NDK —— 精确匹配原厂 .ko 的 vermagic 编译器串
        run: |
          set -e
          # 原厂 .ko 的 vermagic 编译器串为：
          #   Android (8508608, based on r450784e) clang version 14.0.7 (...)
          # 这正是 Android NDK r25 系列自带的 clang（公开、CI 从 GitHub 拉取极快、版本串精确一致）。
          # 注意：googlesource 的 prebuilts/clang 部分克隆无法按需提供历史目录树，故不走 git。
          EXPECT="Android (8508608, based on r450784e) clang version 14.0.7"
          NDK_DIR=""
          for NV in r25c r25b r25; do
            echo ">>> try NDK $NV"
            rm -rf ndk.zip android-ndk-*
            if ! curl -fSL --retry 6 --retry-delay 5 --max-time 900 -o ndk.zip \
                 "https://github.com/android/ndk/releases/download/$NV/android-ndk-$NV-linux.zip" 2>/dev/null; then
              echo "  download failed for $NV"; continue
            fi
            unzip -q ndk.zip
            rm -f ndk.zip
            D=$(find "$PWD" -maxdepth 1 -type d -name 'android-ndk-*' | head -1)
            CLANG="$D/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
            if [ ! -x "$CLANG" ]; then echo "  no clang in $NV"; continue; fi
            VER=$("$CLANG" --version | head -1)
            echo ">>> $NV clang: $VER"
            if echo "$VER" | grep -qF "$EXPECT"; then
              NDK_DIR="$D"; echo "MATCH at $NV"; break
            else
              echo "  version 不匹配，尝试下一个"
            fi
          done
          if [ -z "$NDK_DIR" ]; then
            echo "ERROR: 没有匹配的 NDK clang（需精确匹配 '$EXPECT'）"; exit 1
          fi
          # 只保留 llvm 工具链目录，删掉 NDK 其余部分（约 2.5GB）以省免费 runner 磁盘
          LLVM="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          mv "$LLVM" /tmp/llvm-clang
          rm -rf "$NDK_DIR"
          CLANG_DIR=/tmp/llvm-clang
          echo ">>> CLANG_DIR=$CLANG_DIR"
          "$CLANG_DIR/bin/clang" --version
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

      - name: Clone GKI source (GitHub 镜像优先，失败回退 googlesource)
        run: |
          set -e
          git clone --filter=blob:none --no-checkout \
            https://github.com/KernelSU/kernel_common_mirror common 2>/dev/null || \
          git clone --filter=blob:none --no-checkout \
            https://android.googlesource.com/kernel/common common
          cd common
          git checkout ${{ github.event.inputs.KERNEL_COMMIT }} || \
            { git fetch origin ${{ github.event.inputs.KERNEL_COMMIT }} && git checkout FETCH_HEAD; }
          cd ..

      - name: Integrate SukiSU (optional, 保留 root)
        if: ${{ github.event.inputs.SUKISU == 'true' }}
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -
          cd ..

      - name: Prepare .config from device base + enable namespaces + 匹配原厂 vermagic
        run: |
          set -e
          cp config/w210ds_base.config common/.config
          cd common
          scripts/config --set-str UNUSED_KSYMS_WHITELIST ""
          scripts/config --disable TRIM_UNUSED_KSYMS
          # 先开 SYSVIPC —— IPC_NS 依赖它（设备原配置里 IPC_NS 连选项都没有的根因）
          scripts/config --enable SYSVIPC
          # 强制 LTO=NONE：免费 runner 只有 7GB 内存，LTO 链接会 OOM 被杀
          scripts/config --disable DEBUG_INFO
          scripts/config --enable LD_IS_LLD
          sed -i -E 's/^CONFIG_LTO_CLANG_THIN=.*/# CONFIG_LTO_CLANG_THIN is not set/; s/^CONFIG_LTO_CLANG_FULL=.*/# CONFIG_LTO_CLANG_FULL is not set/; s/^CONFIG_LTO_CLANG=.*/# CONFIG_LTO_CLANG is not set/; s/^CONFIG_LTO_NONE=.*/# CONFIG_LTO_NONE is not set/' .config
          printf 'CONFIG_LTO_NONE=y\n' >> .config
          make LLVM=1 ARCH=arm64 olddefconfig
          if grep -qE '^CONFIG_LTO_CLANG_THIN=y|^CONFIG_LTO_CLANG_FULL=y' .config; then
            echo "ERROR: LTO 仍未关闭"; grep -E 'CONFIG_LTO' .config; exit 1
          fi
          # === 关键：让内核 vermagic 精确匹配原厂 .ko 模块 ===
          # 模块 vermagic = 5.15.178-android13-8-gb370d3baf5b7-ab20251103.222925 ... clang 14.0.7 (r450784e)
          scripts/config --disable LOCALVERSION_AUTO
          scripts/config --set-str LOCALVERSION "-android13-8-gb370d3baf5b7-ab20251103.222925"
          # 再开 Droidspaces 需要的其余命名空间 / cgroup / 网络选项
          scripts/config --enable PID_NS --enable IPC_NS --enable USER_NS \
            --enable DEVTMPFS --enable MACVLAN --enable CGROUP_PIDS \
            --enable CFS_BANDWIDTH --enable IP6_NF_NAT --enable IP6_NF_TARGET_MASQUERADE \
            --enable IKCONFIG --enable IKCONFIG_PROC
          if scripts/config --enable KSU 2>/dev/null; then echo "KSU enabled"; else echo "KSU symbol not present (ok)"; fi
          make LLVM=1 ARCH=arm64 olddefconfig
          cd ..
          echo "=== 校验关键配置（应为 =y） ==="
          for k in PID_NS IPC_NS SYSVIPC USER_NS CGROUP_PIDS CFS_BANDWIDTH DEVTMPFS MACVLAN IP6_NF_NAT IKCONFIG KSU LOCALVERSION LOCALVERSION_AUTO LTO_NONE; do
            v=$(grep -E "^CONFIG_${k}=" common/.config | head -1)
            echo "$k -> ${v:-NOT_FOUND}"
          done

      - name: Build uncompressed Image (用 AOSP clang-r450784e)
        run: |
          set -e
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          cd common
          make LLVM=1 ARCH=arm64 -j"$(nproc)" Image
          ls -la arch/arm64/boot/Image
          echo "=== 校验产物 vermagic 前缀是否匹配原厂模块 ==="
          strings arch/arm64/boot/Image | grep -m1 "5.15.178-android13-8-gb370d3baf5b7" || echo "WARN: vermagic 前缀未匹配，请检查 LOCALVERSION"
          cd ..

      - name: Locate boot_a.bin (asset or download)
        run: |
          BOOT=assets/boot_a.bin
          if [ ! -f "$BOOT" ]; then
            if [ -z "${{ secrets.BOOT_URL }}" ]; then
              echo "ERROR: 既无 assets/boot_a.bin 也无 BOOT_URL secret"; exit 1
            fi
            mkdir -p assets
            curl -L "${{ secrets.BOOT_URL }}" -o "$BOOT"
          fi
          echo "BOOT=$BOOT" >> "$GITHUB_ENV"
          echo "KERNEL=common/arch/arm64/boot/Image" >> "$GITHUB_ENV"

      - name: Repack boot image (byte-level kernel swap)
        run: |
          set -e
          python3 scripts/repack.py "$BOOT" "$KERNEL" boot_a_droidspaces.img
          ls -la boot_a_droidspaces.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot_a_droidspaces.img
          path: boot_a_droidspaces.img
